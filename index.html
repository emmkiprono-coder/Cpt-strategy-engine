The closest thing to SaaS in healthcare billing is layered care management codes. Here's how to build it:

**Tier 1 \u{2014} Base Subscription Layer:**

**Tier 2 \u{2014} Premium Layer:**
\u{2022} 99491 (Complex CCM) \u{2014} $86.41/patient/month \u{2014} requires physician/QHP time, not just clinical staff
\u{2022} Target your top 20% most complex patients for this upgrade

**Tier 3 \u{2014} Add-On Revenue:**
\u{2022} 99439 (CCM add-on) \u{2014} $47.32/additional 20 min \u{2014} stacks on top of 99490
\u{2022} 99458 (RPM add-on) \u{2014} $41.17/additional 20 min \u{2014} stacks on top of 99457

**Tier 4 \u{2014} RPM Overlay:**

\u{2022} Dual-enroll CCM + RPM patients for $113+/patient/month
